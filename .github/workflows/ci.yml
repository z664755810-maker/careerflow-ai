name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # 用真实 PostgreSQL 服务容器，验证后端在 Postgres 上的可移植性
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careerflow
          POSTGRES_PASSWORD: careerflow
          POSTGRES_DB: careerflow
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://careerflow:careerflow@localhost:5432/careerflow
      SECRET_KEY: ci-secret
      LLM_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check app
      - name: Migrate (alembic)
        run: alembic upgrade head
      - name: Test (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        run: |
          npm install
          npm run build
